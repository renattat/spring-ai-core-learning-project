spring.application.name=ollama_lerning_project
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# Настройки Ollama (локальная нейросеть)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.datasource.url=jdbc:h2:file:C:/Users/New/Desktop/Udemy/From_Java_Dev_To_AI_Engineer_Spring_AI_Fast_Track/chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=renat
spring.datasource.password=12345
spring.h2.console.enabled=true
#http://localhost:8080/h2-console/
#SELECT * FROM SPRING_AI_CHAT_MEMORY

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.docker.compose.stop.command=down
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.collection-name=renatai
